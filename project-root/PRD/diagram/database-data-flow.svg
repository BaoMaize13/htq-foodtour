<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.5" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:800 44px 'Segoe UI',Arial,sans-serif;fill:#0f172a;letter-spacing:-1px}
      .subtitle{font:500 21px 'Segoe UI',Arial,sans-serif;fill:#475569}
      .box-title{font:800 25px 'Segoe UI',Arial,sans-serif;fill:#fff}
      .box-sub{font:600 17px 'Segoe UI',Arial,sans-serif;fill:#e2e8f0}
      .small{font:500 18px 'Segoe UI',Arial,sans-serif;fill:#334155}
      .tiny{font:500 16px 'Segoe UI',Arial,sans-serif;fill:#64748b}
      .label{font:800 16px 'Segoe UI',Arial,sans-serif;fill:#0f172a}
      .pill{font:700 15px 'Segoe UI',Arial,sans-serif;fill:#334155}
      .note{font:600 16px 'Segoe UI',Arial,sans-serif;fill:#78350f}
      .arrow{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .arrow-dash{stroke:#64748b;stroke-width:3;fill:none;stroke-dasharray:10 8;marker-end:url(#arrow)}
      .panel{fill:#fff;stroke:#e2e8f0;stroke-width:2;filter:url(#shadow)}
      .chip{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1700" height="980" rx="36" fill="url(#bg)"/>
  <circle cx="120" cy="110" r="95" fill="#fed7aa" opacity="0.45"/>
  <circle cx="1580" cy="890" r="150" fill="#bae6fd" opacity="0.45"/>
  <text x="80" y="80" class="title">Database Data Flow — Hà Tôn Quyền Street Food Review</text>
  <text x="82" y="118" class="subtitle">Luồng dữ liệu từ Web Admin và Mobile App qua Backend API tới MongoDB collections</text>

  <!-- sources -->
  <rect x="80" y="190" width="330" height="190" rx="26" fill="url(#purple)" filter="url(#shadow)"/>
  <text x="112" y="245" class="box-title">Web Admin</text>
  <text x="112" y="278" class="box-sub">Dashboard / CMS quản trị</text>
  <text x="112" y="322" class="box-sub">• POI, category, menu</text>
  <text x="112" y="350" class="box-sub">• Narration/audio</text>

  <rect x="80" y="610" width="330" height="190" rx="26" fill="url(#orange)" filter="url(#shadow)"/>
  <text x="112" y="665" class="box-title">Mobile App</text>
  <text x="112" y="698" class="box-sub">.NET MAUI / AppShell</text>
  <text x="112" y="742" class="box-sub">• Search / FullMap</text>
  <text x="112" y="770" class="box-sub">• POI Detail / Saved</text>

  <!-- api -->
  <rect x="565" y="380" width="390" height="240" rx="30" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="605" y="440" class="box-title">Backend API</text>
  <text x="605" y="474" class="box-sub">Node.js / Express</text>
  <text x="605" y="520" class="box-sub">JWT middleware + requireRole</text>
  <text x="605" y="550" class="box-sub">Routes / Controllers / Services</text>
  <text x="605" y="580" class="box-sub">DTO response cho mobile</text>

  <!-- db -->
  <rect x="1110" y="260" width="490" height="490" rx="34" fill="url(#green)" filter="url(#shadow)"/>
  <text x="1150" y="322" class="box-title">MongoDB Database</text>
  <text x="1150" y="356" class="box-sub">Collections chính</text>

  <rect x="1148" y="392" width="180" height="48" rx="14" class="chip"/><text x="1170" y="423" class="pill">users / roles</text>
  <rect x="1350" y="392" width="205" height="48" rx="14" class="chip"/><text x="1372" y="423" class="pill">ownerprofiles</text>
  <rect x="1148" y="460" width="180" height="48" rx="14" class="chip"/><text x="1170" y="491" class="pill">categories</text>
  <rect x="1350" y="460" width="205" height="48" rx="14" class="chip"/><text x="1372" y="491" class="pill">pois</text>
  <rect x="1148" y="528" width="180" height="48" rx="14" class="chip"/><text x="1170" y="559" class="pill">menuitems</text>
  <rect x="1350" y="528" width="205" height="48" rx="14" class="chip"/><text x="1372" y="559" class="pill">reviews</text>
  <rect x="1148" y="596" width="180" height="48" rx="14" class="chip"/><text x="1170" y="627" class="pill">narrations</text>
  <rect x="1350" y="596" width="205" height="48" rx="14" class="chip"/><text x="1372" y="627" class="pill">audioassets</text>
  <rect x="1148" y="664" width="180" height="48" rx="14" class="chip"/><text x="1170" y="695" class="pill">favorites</text>
  <rect x="1350" y="664" width="205" height="48" rx="14" class="chip"/><text x="1372" y="695" class="pill">livesessions</text>

  <!-- flows -->
  <path d="M410 285 C480 285 500 430 560 455" class="arrow"/>
  <text x="425" y="262" class="label">CRUD / Moderation</text>
  <path d="M410 705 C500 705 505 570 560 545" class="arrow"/>
  <text x="425" y="748" class="label">GET POI / Saved / Profile</text>
  <path d="M955 500 C1010 500 1040 505 1105 505" class="arrow"/>
  <text x="978" y="478" class="label">Mongoose query/update</text>
  <path d="M1110 570 C1030 630 940 660 840 625" class="arrow-dash"/>
  <text x="905" y="690" class="label">JSON DTO response</text>
  <path d="M610 380 C540 300 480 270 410 270" class="arrow-dash"/>
  <text x="470" y="365" class="tiny">Admin list/detail/update status</text>

  <!-- bottom mapping -->
  <rect x="80" y="850" width="1520" height="80" rx="22" class="panel"/>
  <text x="112" y="885" class="note">Mapping quan trọng:</text>
  <text x="282" y="885" class="small">pois → SearchPage/FullMap/PoiDetail</text>
  <text x="640" y="885" class="small">menuitems → PoiDetail menu</text>
  <text x="940" y="885" class="small">narrations/audioassets → Audio Queue/TTS</text>
  <text x="1285" y="885" class="small">favorites → SavedPage</text>
  <text x="282" y="916" class="tiny">Web Admin tạo dữ liệu → Backend validate/lưu MongoDB → Mobile gọi API và cache local khi cần.</text>
</svg>